<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ElBruno.MarkItDotNet: structured documents</title>
  <desc id="desc">Markdown, ZIP archives, and structured documents connected to Microsoft.Extensions.DataIngestion.</desc>
