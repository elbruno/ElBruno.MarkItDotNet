<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">De un ZIP a IngestionDocument en cuatro pasos</title>
  <desc id="desc">El conector descubre entradas, el conversor produce Markdown, el parser construye CoreModel y el adaptador transforma ese modelo en IngestionDocument. La etapa de chunking es externa y posterior.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L9 5L0 10" fill="none" stroke="#7f73a0" stroke-width="2"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#faf9fd"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="80" y="102" fill="#252039" font-size="46" font-weight="700">Un ZIP. Cuatro responsabilidades.</text>
    <text x="80" y="153" fill="#625970" font-size="26">Descubrir no es convertir. Convertir no es parsear. Parsear no es hacer chunking.</text>
    <g transform="translate(80 226)">
      <rect width="320" height="302" rx="24" fill="#eee7fa" stroke="#cbbcde"/>
      <circle cx="42" cy="43" r="23" fill="#6439bd"/><text x="42" y="51" text-anchor="middle" font-size="22" fill="white">1</text>
      <text x="24" y="109" font-size="27" font-weight="700" fill="#382551">ZipArchiveConnector</text>
      <text x="24" y="155" font-size="23" fill="#625970">SourceDocument</text>
      <text x="24" y="195" font-size="22" fill="#625970">OpenReadAsync()</text>
      <text x="24" y="259" font-size="20" fill="#6439bd">Sin extraer a disco</text>
    </g>
    <path d="M408 376H446" stroke="#7f73a0" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(456 226)">
      <rect width="320" height="302" rx="24" fill="white" stroke="#cbbcde"/>
      <circle cx="42" cy="43" r="23" fill="#6439bd"/><text x="42" y="51" text-anchor="middle" font-size="22" fill="white">2</text>
      <text x="24" y="109" font-size="27" font-weight="700" fill="#382551">MarkdownConverter</text>
      <text x="24" y="155" font-size="23" fill="#625970">Stream + extension</text>
      <text x="24" y="195" font-size="22" fill="#625970">Markdown string</text>
      <text x="24" y="259" font-size="20" fill="#6439bd">Conversión por formato</text>
    </g>
    <path d="M784 376H822" stroke="#7f73a0" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(832 226)">
      <rect width="320" height="302" rx="24" fill="white" stroke="#cbbcde"/>
      <circle cx="42" cy="43" r="23" fill="#6439bd"/><text x="42" y="51" text-anchor="middle" font-size="22" fill="white">3</text>
      <text x="24" y="109" font-size="22" font-weight="700" fill="#382551">MarkdownDocumentParser</text>
      <text x="24" y="155" font-size="23" fill="#625970">CoreModel.Document</text>
      <text x="24" y="195" font-size="22" fill="#625970">Secciones y bloques</text>
      <text x="24" y="259" font-size="20" fill="#6439bd">IDs y spans de origen</text>
    </g>
    <path d="M1160 376H1198" stroke="#7f73a0" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(1208 226)">
      <rect width="312" height="302" rx="24" fill="#e4f5ee" stroke="#b4dccb"/>
      <circle cx="42" cy="43" r="23" fill="#267b67"/><text x="42" y="51" text-anchor="middle" font-size="22" fill="white">4</text>
      <text x="24" y="109" font-size="25" font-weight="700" fill="#24463f">ToIngestionDocument</text>
      <text x="24" y="155" font-size="23" fill="#48675e">Headers y tablas</text>
      <text x="24" y="195" font-size="22" fill="#48675e">Metadata y Markdown</text>
      <text x="24" y="259" font-size="20" fill="#267b67">Dependencia preview aislada</text>
    </g>
    <rect x="80" y="592" width="1440" height="100" rx="18" fill="#f0edf5"/>
    <text x="110" y="633" fill="#382551" font-size="24" font-weight="700">Después, tu pipeline elige la estrategia</text>
    <text x="110" y="670" fill="#625970" font-size="22">Chunking, embeddings e indexación son etapas posteriores. El adaptador no las ejecuta.</text>
    <text x="80" y="774" fill="#625970" font-size="22">ZIP: límites de archivo, entradas y bytes descomprimidos. Sin procesamiento recursivo de ZIP anidados.</text>
    <text x="80" y="817" fill="#625970" font-size="22">Source spans: referencias al Markdown parseado, no coordenadas del PDF o DOCX original.</text>
  </g>
</svg>
